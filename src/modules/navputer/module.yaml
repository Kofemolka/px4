module_name: navputer
parameters:
- group: NAVPUTER
  definitions:
    NPT_EN:
      description:
        short: NAVPUTER enable
      type: boolean
      default: 1

    NPT_RNGBC_CTRL:
      description:
        short: Ranging beacon fusion control
        long: Enable/disable ranging beacon fusion.
      type: enum
      values:
        0: Disable ranging beacon fusion
        1: Enable ranging beacon fusion
      default: 1
    NPT_RNGBC_DELAY:
      description:
        short: Ranging beacon measurement delay relative to IMU measurements
      type: float
      default: 0
      min: 0
      max: 1000
      unit: ms
      reboot_required: true
      decimal: 1
    NPT_RNGBC_GATE:
      description:
        short: Gate size for ranging beacon fusion
        long: Sets the number of standard deviations used by the innovation consistency test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    NPT_RNGBC_NOISE:
      description:
        short: Measurement noise for ranging beacon fusion
        long: Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 50.0
      min: 0.1
      max: 500.0
      unit: m
      decimal: 1

    NPT_FUSE_BARO:
      description:
        short: Barometer fusion enable
        long: Enable/disable barometric height fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_MAG:
      description:
        short: Magnetometer fusion enable
        long: Enable/disable magnetometer fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_RNGBC:
      description:
        short: Ranging beacon fusion enable
        long: Enable/disable ranging beacon fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_AGP0:
      description:
        short: Aux global position 0 fusion enable
        long: Enable/disable aux global position source 0 fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_GPS:
      description:
        short: GPS fusion switch
        long: Enable/disable GPS fusion in the navputer estimator
      type: boolean
      default: 1
    NPT_GPS_CTRL:
      description:
        short: GNSS sensor aiding
        long: 'Set bits in the following positions to enable: 0 : Longitude and latitude
          fusion 1 : Altitude fusion 2 : 3D velocity fusion 3 : Dual antenna heading
          fusion'
      type: bitmask
      bit:
        0: Lon/lat
        1: Altitude
        2: 3D velocity
        3: Dual antenna heading
      default: 7
      min: 0
      max: 15
    NPT_GPS_INSTANCE:
      description:
        short: GPS instance number
        long: Picks a GPS instance to subscribe on
      type: int32
      default: 0
      min: 0
      max: 3

    NPT_FC_AGP_LATCH:
      description:
        short: Minimum time to hold aux global position fusion enabled
        long: Once aux global position fusion is enabled, keep it enabled for at least
          this long even if the enable condition drops out, to avoid rapidly toggling
          fusion on and off.
      type: float
      default: 5.0
      min: 0.0
      unit: s
      decimal: 1

    NPT_MD_MOT_GYR:
      description:
        short: Min gate for moving Gyro
        long: Gate which detects minimum Gyro magnitude that is considered as moving
      type: float
      default: 0.05
      unit: rad/s
    NPT_MD_MOT_ACC:
      description:
        short: Min gate for moving Acceleration
        long: Gate which detects minimum Acceleration magnitude that is considered as moving
      type: float
      default: 0.6
      unit: m/s^2
    NPT_MD_CF_TIME:
      description:
        short: Confirmation time for motion
        long: Amount of continuous motion time needed to transition from landed stationary to airborne moving
      type: int32
      default: 300
      min: 0
      max: 10000
      unit: ms
