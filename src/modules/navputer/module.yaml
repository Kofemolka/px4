module_name: navputer
parameters:
- group: NAVPUTER
  definitions:
    NPT_EN:
      description:
        short: NAVPUTER enable
      type: boolean
      default: 1

    NPT_RNGBC_CTRL:
      description:
        short: Ranging beacon fusion control
        long: Enable/disable ranging beacon fusion.
      type: enum
      values:
        0: Disable ranging beacon fusion
        1: Enable ranging beacon fusion
      default: 1
    NPT_RNGBC_DELAY:
      description:
        short: Ranging beacon measurement delay relative to IMU measurements
      type: float
      default: 0
      min: 0
      max: 1000
      unit: ms
      reboot_required: true
      decimal: 1
    NPT_RNGBC_GATE:
      description:
        short: Gate size for ranging beacon fusion
        long: Sets the number of standard deviations used by the innovation consistency test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    NPT_RNGBC_NOISE:
      description:
        short: Measurement noise for ranging beacon fusion
        long: Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 50.0
      min: 0.1
      max: 500.0
      unit: m
      decimal: 1

    NPT_FUSE_BARO:
      description:
        short: Barometer fusion enable
        long: Enable/disable barometric height fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_MAG:
      description:
        short: Magnetometer fusion enable
        long: Enable/disable magnetometer fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_RNGBC:
      description:
        short: Ranging beacon fusion enable
        long: Enable/disable ranging beacon fusion in the navputer estimator.
      type: boolean
      default: 1
    NPT_FUSE_AGP0:
      description:
        short: Aux global position 0 fusion enable
        long: Enable/disable aux global position source 0 fusion in the navputer estimator.
      type: boolean
      default: 1

    MD_GT_STAT_GYR:
      description:
        short: Max gate for stationary Gyro
        long: Gate which detects maximum Gyro magnitude that is considered stationary enough
      type: float
      default: 0.03
      unit: rad/s
    MD_GT_STAT_ACC:
      description:
        short: Max gate for stationary Acceleration
        long: Gate which detects maximum Acceleration magnitude that is considered stationary enough
      type: float
      default: 0.35
      unit: m/s^2
    MD_GT_STAT_SPD:
      description:
        short: Max gate for stationary Speed
        long: Gate which detects maximum Speed that is considered stationary enough
      type: float
      default: 0.3
      unit: m/s
    MD_STAT_CF_TIME:
      description:
        short: Confirmation time for stationary
        long: Amount of time needed to confirm the stationary mode
      type: int32
      default: 3000000
      unit: us
    MD_GT_MOT_GYR:
      description:
        short: Min gate for moving Gyro
        long: Gate which detects minimum Gyro magnitude that is considered as moving
      type: float
      default: 0.05
      unit: rad/s
    MD_GT_MOT_ACC:
      description:
        short: Min gate for moving Acceleration
        long: Gate which detects minimum Acceleration magnitude that is considered as moving
      type: float
      default: 0.6
      unit: m/s^2
    MD_GT_MOT_SPD:
      description:
        short: Max gate for stationary Speed
        long: Gate which detects minimum Speed that is considered as moving
      type: float
      default: 0.8
      unit: m/s
